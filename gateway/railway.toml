[build]
builder = "nixpacks"
buildCommand = "npm install && npx prisma generate && DATABASE_URL=$DIRECT_URL npx prisma db push --accept-data-loss && npm run build"

[deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[deploy.healthchecks]]
type = "tcp"
port = 18790
